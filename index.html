<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Connect Four</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Arimo:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">

<body>
    <!--TODO: Build the Markup for your Game. Don't forget to style it in a cascading stylesheet. -->

    <script type="module" src="js/controller.connectfour.js"></script>
    <script type="module" src="js/model.connectfour.js"></script>
    <script type="module" src="js/view.polished.js"></script>


    <div id="start-screen">
        <div class="start-content">
            <h1>CONNECT FOUR</h1>
            <div class="vs-preview">
                <span class="p1">Candace</span>
                <span class="vs-small">VS</span>
                <span class="p2">Vanessa</span>
                <span class="begin-info">Candace begins!</span>
            </div>
            <button id="start-button">Play Game</button>
        </div>
    </div>

    <nav id="status-bar">
        <div id="Candace">Candace</div>
        <div id="vs">VS</div>
        <div id="Vanessa">Vanessa</div>
    </nav>

    <div class="game-area">

        <div class="candace-img">
            <img src="img/candace.png" id="candace-image" alt="Candace">
        </div>


        <div class="grid-container">
            <div class="cell-1"></div>
            <div class="cell-2"></div>
            <div class="cell-3"></div>
            <div class="cell-4"></div>
            <div class="cell-5"></div>
            <div class="cell-6"></div>
            <div class="cell-7"></div>

            <div class="cell-3"></div>
            <div class="cell-4"></div>
            <div class="cell-5"></div>
            <div class="cell-6"></div>
            <div class="cell-7"></div>
            <div class="cell-1"></div>
            <div class="cell-2"></div>
            <div class="cell-3"></div>
            <div class="cell-4"></div>
            <div class="cell-5"></div>
            <div class="cell-6"></div>
            <div class="cell-7"></div>
            <div class="cell-1"></div>
            <div class="cell-2"></div>
            <div class="cell-3"></div>
            <div class="cell-4"></div>
            <div class="cell-5"></div>
            <div class="cell-6"></div>
            <div class="cell-7"></div>
            <div class="cell-1"></div>
            <div class="cell-2"></div>
            <div class="cell-3"></div>
            <div class="cell-4"></div>
            <div class="cell-5"></div>
            <div class="cell-6"></div>
            <div class="cell-7"></div>
        </div>

        <div class="vanessa-img">
            <img src="img/vanessa.png" id="vanessa-image" alt="Vanessa">
        </div>


    </div>

    <button id="reset-button">New Game</button>


</body>
</html>
